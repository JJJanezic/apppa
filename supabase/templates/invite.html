<h2>Einladung zu apppa</h2>
<p>Hallo,</p>
<p>Sie wurden eingeladen, apppa zu nutzen. Klicken Sie auf den folgenden Link, um die Einladung anzunehmen und Ihr Passwort festzulegen:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/">Einladung annehmen</a></p>
<p>Falls Sie diese Einladung nicht erwartet haben, können Sie diese E-Mail ignorieren.</p>
